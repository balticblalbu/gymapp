services:
  db:
    image: postgres:16-alpine
    container_name: gymapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymapp
      POSTGRES_PASSWORD: gymapp
      POSTGRES_DB: gymapp
    ports:
      # Exposed so `npm run dev` on the host can reach it too.
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymapp -d gymapp']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gymapp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the database is reachable as "db".
      DATABASE_URL: postgresql://gymapp:gymapp@db:5432/gymapp?schema=public
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
